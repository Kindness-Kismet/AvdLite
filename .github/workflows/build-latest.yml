name: Build Latest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: avdlite-latest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 最新稳定镜像（KSU=${{ matrix.ksu }}）
    strategy:
      fail-fast: false
      matrix:
        ksu: [true, false]
    uses: ./.github/workflows/build-version.yml
    with:
      api: latest
      page_size: auto
      enable_ksu: ${{ matrix.ksu }}

  release:
    name: 发布两个最新镜像
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: AvdLite-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: 校验并发布两个 ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: latest-${{ github.run_number }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/release
        run: |
          cd "$RELEASE_DIRECTORY"
          sha256sum --check -- *.sha256
          assets=(AvdLiteWithKsu-Android*-api*.zip AvdLiteWithoutKsu-Android*-api*.zip)
          [[ ${#assets[@]} -eq 2 && -f "${assets[0]}" && -f "${assets[1]}" ]]
          gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --latest --title "AvdLite $RELEASE_TAG" --notes-file "$GITHUB_WORKSPACE/docs/release-notes.md"
